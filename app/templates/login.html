<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SalonOS – Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1E1B2E 0%, #2D2843 50%, #1E1B2E 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
    }
    .login-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #8B5CF6, #EC4899);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: white;
      margin: 0 auto 16px;
    }
    .login-card h1 {
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      color: #1F2937;
      margin-bottom: 4px;
    }
    .login-card .subtitle {
      text-align: center;
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 32px;
    }
    .login-card label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6B7280;
      display: block;
      margin-bottom: 6px;
    }
    .login-card input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E5E7EB;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 20px;
      transition: all 0.2s;
    }
    .login-card input:focus {
      outline: none;
      border-color: #8B5CF6;
      box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
    }
    .login-card button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8B5CF6, #7C3AED);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .login-card button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(139,92,246,0.4);
    }
    .login-card .error {
      background: #FEE2E2;
      color: #991B1B;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      margin-bottom: 16px;
    }
    .login-card .demo-info {
      text-align: center;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #F3F4F6;
      font-size: 12px;
      color: #9CA3AF;
    }
    .login-card .demo-info code {
      background: #F3F4F6;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #6B7280;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">S</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your SalonOS dashboard</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <label>Email</label>
      <input type="email" name="email" placeholder="owner@salonos.com" value="owner@salonos.com" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" value="password123" required>

      <button type="submit">Sign In</button>
    </form>

    <div class="demo-info">
      <strong>Demo Credentials</strong><br>
      Email: <code>owner@salonos.com</code><br>
      Password: <code>password123</code>
    </div>
  </div>
</body>
</html>
